name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, bcmath
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env

      - run: php artisan key:generate

      - name: PHPUnit
        run: php artisan test --coverage-clover=coverage.xml --log-junit=junit.xml

      - name: PHPStan
        if: ${{ !cancelled() }}
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/junit.xml
            backend/coverage.xml

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        continue-on-error: true
        run: |
          npx eslint . --format json --output-file eslint-report.json || true
          npx eslint .

      - name: Vitest
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - run: npm run build

      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            frontend/junit.xml
            frontend/eslint-report.json

  leodeguita:
    name: Leodeguita (mobile web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leodeguita
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: leodeguita/package-lock.json

      - run: npm ci

      - name: ESLint
        continue-on-error: true
        run: |
          npx eslint . --format json --output-file eslint-report.json || true
          npx eslint .

      - name: Vitest
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - run: npm run build

      - name: Upload leodeguita reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leodeguita-reports
          path: |
            leodeguita/junit.xml
            leodeguita/eslint-report.json